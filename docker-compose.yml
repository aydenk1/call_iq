services:
  call_iq:
    build: .
    command: /app/start_services.sh
    depends_on:
        - db
    image: call_iq:${IMAGE_TAG}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-calliq}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-calliq}
      TZ: ${TZ}
      UNIFI_PASSWORD: ${UNIFI_PASSWORD}
      UNIFI_USERNAME: ${UNIFI_USERNAME}
    gpus: all
    ports:
     - "3000:3000"
     - "8000:8000"
    secrets:
      - ssh_private_key
      - ssh_public_key
      - ssh_known_hosts
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - label=disable
    shm_size: "16g"
    tty: true
    working_dir: /app
    volumes:
      - .:/app
      - call_iq_cache:/root/.cache
      - call_iq_web_node_modules:/app/web/node_modules
    
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-calliq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-calliq}
      TZ: ${TZ}
    volumes:
      - call_iq_pgdata:/var/lib/postgresql/data
    ports:
      - "${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      
volumes:
  call_iq_cache:
  call_iq_pgdata:
  call_iq_web_node_modules:

secrets:
  ssh_private_key:
    file: ${HOME}/.ssh/id_ed25519
  ssh_public_key:
    file: ${HOME}/.ssh/id_ed25519.pub
  ssh_known_hosts:
    file: ${HOME}/.ssh/known_hosts
