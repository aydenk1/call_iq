global:
  work_dir: "data"
  recording_dir: "recordings" # work_dir / recording_dir
  whisper_dir: "whisper" # work_dir / whisper_dir
  verbose: true # logging level

unifi_ingestion: # Ingests call log data from UniFi call logs
  activate: true
  base_url: "https://192.168.1.1"
  call_url: "/proxy/talk/api/call_log"
  page_size: "25"
  sleep_between_request_s: 60
  sleep_same_request_s: .2
  
ssh: # Required for syncing new calls
  activate: true # Use true to skip downloading of new calls
  remote_host: "unifi-router"
  remote_path: "/volume1/.srv/unifi-talk/recordings"
  
whisper:
  activate: true # Performs transcription of new calls
  device: "ayden-workstation" # Select which device_config to use
  merge_segments_s: null # Set to null to skip segment mergeing
  db_commit_batch_size: 32 # Process this many files before commiting to db.
  force: # Forces reprocessing of the whisper pipeline 
    preprocess: false
    transcribe: true
    postprocess: false
  whisper_backend: "faster-whisper"
  whisper_model_kwargs:
    no_speech_threshold: 0.6 # (default is already 0.6)
    log_prob_threshold: -1.0 # (keep)
    compression_ratio_threshold: 2.0 # (keep default) or tighten slightly
    beam_size: 5 # (quality bump without getting weird)
    best_of: 5 # (only used when temperature > 0; safe to include)
    language: "en"
    log_progress: false
    patience: 1.0 # (don’t over-extend beams)
    temperature: 0.0 # (deterministic)
    without_timestamps: false
    condition_on_previous_text: false
    vad_parameters:
      threshold: 0.55 # (slightly stricter than 0.5)
      min_silence_duration_ms: 500 # (split sooner; default 2000 is huge)
      speech_pad_ms: 120 # (default 400 is big)
      min_speech_duration_ms: 200 # (throw away tiny blips)
    initial_prompt: >-
      This is a phone call for an automotive and appliance shop, known as Oswalt-Thomas or Goodyear.
      We are based in Wabash, Indiana. Common terms: GE, tires, appliances, alignment, service, oil.
      Common names: Ayden, Zach, Eric.
  alignment_backend: "whisperx-alignment"
  alignment_model_kwargs:
    enabled: true
    device: "cuda" # set to "cpu" if no GPU is available
    model_name: null
    return_char_alignments: false
    
  device_config: # Fine tuned pipeline configs for best performance on available hardware
    ayden-sn1:
      model_name: "large-v3"
      device: "cuda"
      compute_type: "int8_float32"
      batch_size: 1
      num_workers: 1  # Uses all cpu cores

    ayden-workstation:
      model_name: "large-v3"
      device: "cuda"
      compute_type: "float16"
      batch_size: 8
      num_workers: 10  # Uses all cpu cores

  
  # hotwords: >-
  #  Oswalt-Thomas
  #  Goodyear
  #  Wabash
  #  GE
  #  tires
  #  appliances
  #  alignment
  #  service
  #  Ayden
  #  Zach
  #  Eric
